# Kratos-Rebirth 主题配置覆盖文件
# 此文件中的配置会覆盖主题默认配置

# 图片配置
image:
  favicon: "/images/favicon.png" # 站点图标
  avatar: "/images/avatar.png" # 个人信息挂件上的头像
  banner: # 站点横幅
    light: "" # 亮色模式
    dark: "" # 暗色模式
  background: # 站点背景
    light: "/images/background_light.png" # 亮色模式
    dark: "/images/background_dark.png" # 暗色模式
  about: # 介绍卡片
    light: "" # 亮色模式
    dark: "" # 暗色模式

# 导航栏配置
nav:
  auto_hide: true
  items:
    - label: 首页
      icon: home
      url: /
    - label: 归档
      icon: archive
      url: /archives/
    - label: 分类
      icon: folder
      url: /categories/
    - label: 标签
      icon: tags
      url: /tags/
    - label: 友链
      icon: link
      url: /friends/
    - label: 服务
      icon: server
      url: /services/
    - label: 关于
      icon: user
      url: /about/
    - label: 联系
      icon: envelope
      url: /contact/

# Footer 页脚组件配置
footer:
  links: []
  # - icon: # 使用来自 fontawesome icons 4.7.0 图标库中的唯一标识；或者插入自定义的 HTML ，例如您可在此放置一串 svg 。
  #   link: # 按钮导向的目标链接
  #   addition: target="_blank" rel="nofollow" # 可选，用于指定链接的追加模式信息
  components: # 一些有特色的组件 （其他的请在 additional 自行追加）
    uptime:
      since: "2025/12/04 13:58:00"
      text: "本站已运行"
    author:
      homepage: "https://blog.rimuru.work" # 可以导向作者的首页
    additional:
      - - '本页访问人次:<span id="page_pv"></span>'
        - '本页访问人数:<span id="page_uv"></span>'
      - - '<a href="/about/">关于</a> | <a href="/contact/">联系</a> | <a href="/privacy/">隐私政策</a> | <a href="/terms/">服务条款</a>'

# 侧边栏与小挂件
sidebar:
  location: right # 侧边栏的位置
  widgets: # 小挂件的顺序
  - about # 关于
  - splitter # 分割线（这个不是个实际挂件，而是用来切分定位的）
  - toc # 目录
  - category # 分类列表
  - tagcloud # 标签聚合
  - posts # 最新文章

# 打赏组件设置
donate:
  enable: false # 是否启用打赏功能

# 版权提示
copyright_notice:
  append_copy: # 在复制时追加
    enable: false # 是否启用

# 评论系统（CWD）
# 文档：https://cwd.js.org/guide/frontend-config.html
# 加载与主题适配逻辑见 source/js/cwd-loader.js，样式见 source/css/cwd-custom.css
comments:
  core: # 评论挂件
    enable_at:
      - post # 文章页展示评论区
      - page # 独立页面展示评论区（仅对 front matter 中 comments: true 的页面生效）
    template:
      _shared: '<div id="cwd-comments" class="kr-comments" data-post-slug="$PATH"></div>'
  count: # 评论数（文章元信息）
    enable_at:
      - post # 文章页顶部显示「N 条评论」
    template:
      _shared: '<span class="cwd-comment-count" data-path="$PATH">0</span>'
  path_hasher: "md5"

# Google AdSense 广告位配置
# 注意：adsbygoogle.js 已在 additional_injections.after_footer 中全局加载
# 广告单元请先到 AdSense 控制台「广告 → 按广告单元」创建，然后把 data-ad-slot 填到下面
adsense:
  client: "ca-pub-9760626627924711" # 发布商 ID
  domains: # 生产域名白名单：仅这些域名（含子域）加载真实广告；localhost 等其他环境只显示占位框，避免调试时产生无效流量
    - blog.rimuru.work
  label: "广告" # 广告位标签（用于与正文内容区分，符合 AdSense 政策）
  index: # 首页文章列表广告（固定插在第一篇文章之后）
    enable: true
    slot: "3453213082" # 信息流广告单元 ID
    layout_key: "-fb+5w+4e-db+86" # 来自控制台该单元代码中的 data-ad-layout-key（fluid 类型单元必须）
    format: "auto" # 仅当 layout_key 为空时生效；fluid 单元忽略此配置
  post_content: # 文章正文第一个段落之后的纯文本样式广告（固定位置）
    enable: true
    slot: "7668624414" # 「文章内广告」单元 ID
    layout_key: "-gw-3+1f-3d+2z" # 来自控制台该单元代码中的 data-ad-layout-key
    min_length: 0 # 正文渲染后 HTML 短于该值不插广告；0 = 不限制（靠「至少 2 个二级标题」的结构条件兜底，精炼短文也能插）
    # 单篇文章关闭：在 front-matter 中写 no_ads: true

# 额外的注入代码
additional_injections:
  head: |
    <!-- IndexNow -->
    <meta name="indexnow-key" content="ef9e736ebb984053bdc3d18cf250bfa0">
    <!-- Preconnect hints for faster resource loading -->
    <!-- CWD 评论系统资源预连接 -->
    <link rel="preconnect" href="https://cwd-api.rimuru.work" crossorigin>
    <link rel="dns-prefetch" href="https://cwd-api.rimuru.work">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://leantrace.rimuru.work" crossorigin>
    <link rel="dns-prefetch" href="https://leantrace.rimuru.work">
    <link rel="preconnect" href="https://www.googletagmanager.com" crossorigin>
    <link rel="dns-prefetch" href="https://www.googletagmanager.com">
    <link rel="preconnect" href="https://pagead2.googlesyndication.com" crossorigin>
    <link rel="dns-prefetch" href="https://pagead2.googlesyndication.com">
    <!-- Google AdSense Account Verification -->
    <meta name="google-adsense-account" content="ca-pub-9760626627924711">
    <!-- Google Consent Mode v2 - 区域化默认：非欧洲地区默认授予，EEA/英国/瑞士默认拒绝 -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      // 非欧洲地区：无需同意即可正常投放（Limited Ads 不支持 fluid 广告格式，默认拒绝会导致空填充）
      gtag('consent', 'default', {
        'ad_storage': 'granted',
        'ad_user_data': 'granted',
        'ad_personalization': 'granted',
        'analytics_storage': 'granted'
      });
      // 欧洲经济区 + 英国 + 瑞士：默认拒绝，等待用户选择
      gtag('consent', 'default', {
        'ad_storage': 'denied',
        'ad_user_data': 'denied',
        'ad_personalization': 'denied',
        'analytics_storage': 'granted',
        'region': ['AT','BE','BG','HR','CY','CZ','DK','EE','FI','FR','DE','GR','HU','IS','IE','IT','LV','LI','LT','LU','MT','NL','NO','PL','PT','RO','SK','SI','ES','SE','CH','GB']
      });
    </script>
    <!-- Google tag：必须在同意默认值之后尽早 async 加载，Consent Mode 信号才能传达给 adsbygoogle.js -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-PKP8Z0FC73"></script>
    <!-- Cookie Consent Banner CSS -->
    <style>
      .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
      #cookie-consent{position:fixed;bottom:0;left:0;right:0;background:var(--bg-color,#fff);color:var(--text-color,#333);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;box-shadow:0 -2px 12px rgba(0,0,0,.1);z-index:99999;font-size:14px;flex-wrap:wrap;transition:transform .3s ease}#cookie-consent.hidden{transform:translateY(100%);pointer-events:none}#cookie-consent p{margin:0;flex:1;min-width:200px;line-height:1.6}#cookie-consent a{color:var(--theme-color,#4a9eff);text-decoration:underline}#cookie-consent .btn-group{display:flex;gap:8px;flex-shrink:0}#cookie-consent button{padding:8px 20px;border:none;border-radius:4px;cursor:pointer;font-size:14px;transition:opacity .2s}#cookie-consent button:hover{opacity:.85}#cookie-consent .btn-accept{background:var(--theme-color,#4a9eff);color:#fff}#cookie-consent .btn-reject{background:transparent;color:var(--text-color,#666);border:1px solid var(--border-color,#ddd)}@media(max-width:600px){#cookie-consent{flex-direction:column;align-items:stretch;text-align:center}#cookie-consent .btn-group{justify-content:center}}
    </style>
    <script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "w23n59dlr1");
    </script>
  footer: ""
  after_footer: |
    <!-- CWD 评论系统加载器 -->
    <script defer src="/js/cwd-loader.js"></script>
    <!-- 推荐阅读功能 -->
    <script defer src="/js/recommended-posts.js"></script>
    <!-- 服务页可用性检测 -->
    <script defer src="/js/services-status.js"></script>
    <!-- LeanTrace 访问统计 -->
    <script defer src="https://leantrace.rimuru.work/js/index.min.js" data-base-url="https://leantrace.rimuru.work"></script>
    <!-- Google Analytics（gtag.js 已在 head 中 async 加载） -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-PKP8Z0FC73');
    </script>
    <!-- Google AdSense -->
    <!-- Google AdSense（仅生产域名加载：本地调试不请求广告脚本，杜绝误触与无效流量。白名单见 head 中的 KR_ADSENSE_DOMAINS / theme.adsense.domains） -->
    <script>
    (function(){
      var d = window.KR_ADSENSE_DOMAINS, h = location.hostname, ok = !d || !d.length;
      if (!ok) {
        for (var i = 0; i < d.length; i++) {
          var x = d[i];
          if (h === x || h.slice(-(x.length + 1)) === '.' + x) { ok = true; break; }
        }
      }
      if (ok) {
        var s = document.createElement('script');
        s.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9760626627924711';
        s.crossOrigin = 'anonymous';
        s.async = true;
        document.body.appendChild(s);
      }
    })();
    </script>
    <!-- PJAX analytics reload handler -->
    <script>
      window.addEventListener('pjax:complete', function() {
        const scriptUrl = 'https://leantrace.rimuru.work/js/index.min.js';
        const oldScript = document.querySelector('script[src="' + scriptUrl + '"]');
        if (oldScript) oldScript.remove();
        const newScript = document.createElement('script');
        newScript.src = scriptUrl;
        newScript.defer = true;
        newScript.setAttribute('data-base-url', 'https://leantrace.rimuru.work');
        document.body.appendChild(newScript);
      });
    </script>
    <!-- Cookie Consent Banner -->
    <div id="cookie-consent">
      <p>本站使用 Cookie 来改善用户体验、分析流量并展示个性化广告。继续浏览即表示你同意使用 Cookie。详情请阅读 <a href="/privacy/">隐私政策</a>。</p>
      <div class="btn-group">
        <button class="btn-accept" onclick="acceptCookies()">接受全部</button>
        <button class="btn-reject" onclick="rejectCookies()">仅必要</button>
      </div>
    </div>
    <script>
      (function(){
        var banner = document.getElementById('cookie-consent');
        var consent = localStorage.getItem('cookie_consent');
        function applyConsent(mode) {
          var update = {
            'ad_storage': mode,
            'ad_user_data': mode,
            'ad_personalization': mode
          };
          if (mode === 'granted') update.analytics_storage = 'granted';
          gtag('consent', 'update', update);
        }
        function hideBanner() {
          banner.classList.add('hidden');
          setTimeout(function(){ banner.remove(); }, 300);
        }
        if (consent === 'accepted') {
          hideBanner();
          applyConsent('granted');
        } else if (consent === 'rejected') {
          hideBanner();
        } else {
          applyConsent('denied');
        }
        window.acceptCookies = function() {
          localStorage.setItem('cookie_consent', 'accepted');
          applyConsent('granted');
          hideBanner();
        };
        window.rejectCookies = function() {
          localStorage.setItem('cookie_consent', 'rejected');
          hideBanner();
        };
      })();
    </script>
